coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 70%

ignore:
  - "backend/tests/"
  - "frontend/src/tests/"
  - "**/__tests__/**"
  - "**/node_modules/**"

flags:
  backend:
    paths:
      - backend/app/
  frontend:
    paths:
      - frontend/src/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false